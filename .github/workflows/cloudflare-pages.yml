name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Package publish directory
        run: |
          mkdir .pages-dist
          rsync -a --exclude='.git*' --exclude='.pages-dist' --exclude='wrangler.jsonc' ./ .pages-dist/
      - name: Deploy
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 889384047d90d5adaf3b83479a6d910c
          command: pages deploy .pages-dist --project-name=th-personal-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
